name: Deploy Docker Image To Remote Host

on:
  workflow_dispatch:
    inputs:
      imageTag:
        description: 'docker image tag'
        type: string
        required: true
      registry:
        description: 'select registry'
        type: choice
        default: "registry.cn-hangzhou.aliyuncs.com/opensrcdevelop/auth-server"
        required: true
        options:
          - ccr.ccs.tencentyun.com/opensrcdevelop/auth-server
          - registry.cn-hangzhou.aliyuncs.com/opensrcdevelop/auth-server
          - registry.cn-hangzhou.aliyuncs.com/opensrcdevelop/auth-server-quickstart
      containerName:
        description: 'container name'
        type: string
        required: true
        default: auth_server

jobs:
  deploy-to-remote:
    name: Deploy To Remote Host
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DOCKER_DEPLOY_SSH_PK }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.DOCKER_DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Cleanup Old Container And Image
        run: |
          echo "========================================="
          echo "cleanup old container and image"
          echo "========================================="

          ssh -o StrictHostKeyChecking=no ${{ secrets.DOCKER_DEPLOY_HOST }} "
            echo 'stop and remove old container...'
            docker stop ${{ inputs.containerName }} 2>/dev/null || true
            docker rm ${{ inputs.containerName }} 2>/dev/null || true
            echo 'remove old image...'
            docker rmi \$(docker images -q ${{ inputs.registry }}:${{ inputs.imageTag }}) 2>/dev/null || true
            echo 'cleanup done'
          "

      - name: Execute Docker Pull On Remote Host
        run: |
          FULL_IMAGE="${{ inputs.registry }}:${{ inputs.imageTag }}"
          echo "========================================="
          echo "docker pull ${FULL_IMAGE}"
          echo "========================================="

          ssh -o StrictHostKeyChecking=no ${{ secrets.DOCKER_DEPLOY_HOST }} "
            echo 'docker pull...'
            docker pull ${FULL_IMAGE}
            echo 'done'
          "

      - name: Start New Container
        run: |
          FULL_IMAGE="${{ inputs.registry }}:${{ inputs.imageTag }}"

          echo "========================================="
          echo "start new container"
          echo "container: ${{ inputs.containerName }}"
          echo "image: ${FULL_IMAGE}"
          echo "========================================="

          # Create script content locally and encode to base64
          SCRIPT_CONTENT="docker run -d --name auth_server \
            -p \"\${DOCKER_PORT}:8080\" \
            -e REDIS_HOST=\"\${REDIS_HOST}\" \
            -e REDIS_PORT=\"\${REDIS_PORT}\" \
            -e REDIS_PASSWORD=\"\${REDIS_PASSWORD}\" \
            -e API_DOC_ENABLED=\"\${API_DOC_ENABLED}\" \
            -e SWAGGER_UI_ENABLED=\"\${SWAGGER_UI_ENABLED}\" \
            -e AUTH_SERVER_CONSOLE_CLIENT_ID=\"\${AUTH_SERVER_CONSOLE_CLIENT_ID}\" \
            -e DEFAULT_ISSUER=\"\${DEFAULT_ISSUER}\" \
            -e DEFAULT_CONSOLE_URL=\"\${DEFAULT_CONSOLE_URL}\" \
            -e LOGIN_PAGE_URL=\"\${LOGIN_PAGE_URL}\" \
            -e DB_BASE_URL=\"\${DB_BASE_URL}\" \
            -e DB_USERNAME=\"\${DB_USERNAME}\" \
            -e DB_PASSWORD=\"\${DB_PASSWORD}\" \
            -e DB_PREFIX=\"\${DB_PREFIX}\" \
            -e DEFAULT_TENANT=\"\${DEFAULT_TENANT}\" \
            -e ASYNC_TASK_STORAGE_TYPE=\"\${ASYNC_TASK_STORAGE_TYPE}\" \
            -e S3_ENDPOINT=\"\${S3_ENDPOINT}\" \
            -e S3_ACCESS_KEY=\"\${S3_ACCESS_KEY}\" \
            -e S3_SECRET_KEY=\"\${S3_SECRET_KEY}\" \
            -e S3_BUCKET=\"\${S3_BUCKET}\" \
            -e S3_PATH_STYLE_ACCESS=\"\${S3_PATH_STYLE_ACCESS}\" \
            -e JAVA_OPTS=\"\${JAVA_OPTS}\" \
            -e JWS256=\"\${JWS256}\" \
            -e PYTHON_EXEC_LIMIT_ENABLED=\"\${PYTHON_EXEC_LIMIT_ENABLED}\" \
            -e CHROMA_HOST=\"\${CHROMA_HOST}\" \
            -v auth_server_log_volume:/app/logs \
            --network auth_server_network \
            --restart always \
            \${FULL_IMAGE}"

          SCRIPT_B64=$(echo "$SCRIPT_CONTENT" | base64 -w 0)

          # Deploy and execute script on remote
          ssh -o StrictHostKeyChecking=no ${{ secrets.DOCKER_DEPLOY_HOST }} \
            "echo '$SCRIPT_B64' | base64 -d > /tmp/start_container.sh && \
            DOCKER_PORT='${{ secrets.DOCKER_DEPLOY_APP_PORT }}' \
            REDIS_HOST='${{ vars.DOCKER_DEPLOY_REDIS_HOST }}' \
            REDIS_PORT='${{ vars.DOCKER_DEPLOY_REDIS_PORT }}' \
            REDIS_PASSWORD='${{ secrets.DOCKER_DEPLOY_REDIS_PASSWORD }}' \
            API_DOC_ENABLED='${{ vars.DOCKER_DEPLOY_API_DOC_ENABLED }}' \
            SWAGGER_UI_ENABLED='${{ vars.DOCKER_DEPLOY_SWAGGER_UI_ENABLED }}' \
            AUTH_SERVER_CONSOLE_CLIENT_ID='${{ vars.DOCKER_DEPLOY_AUTH_SERVER_CONSOLE_CLIENT_ID }}' \
            DEFAULT_ISSUER='${{ vars.DOCKER_DEPLOY_DEFAULT_ISSUER }}' \
            DEFAULT_CONSOLE_URL='${{ vars.DOCKER_DEPLOY_DEFAULT_CONSOLE_URL }}' \
            LOGIN_PAGE_URL='${{ vars.DOCKER_DEPLOY_LOGIN_PAGE_URL }}' \
            DB_BASE_URL='${{ vars.DOCKER_DEPLOY_DB_BASE_URL }}' \
            DB_USERNAME='${{ vars.DOCKER_DEPLOY_DB_USERNAME }}' \
            DB_PASSWORD='${{ secrets.DOCKER_DEPLOY_DB_PASSWORD }}' \
            DB_PREFIX='${{ vars.DOCKER_DEPLOY_DB_PREFIX }}' \
            DEFAULT_TENANT='${{ vars.DOCKER_DEPLOY_DEFAULT_TENANT }}' \
            ASYNC_TASK_STORAGE_TYPE='${{ vars.DOCKER_DEPLOY_ASYNC_TASK_STORAGE_TYPE }}' \
            S3_ENDPOINT='${{ vars.DOCKER_DEPLOY_S3_ENDPOINT }}' \
            S3_ACCESS_KEY='${{ secrets.DOCKER_DEPLOY_S3_ACCESS_KEY }}' \
            S3_SECRET_KEY='${{ secrets.DOCKER_DEPLOY_S3_SECRET_KEY }}' \
            S3_BUCKET='${{ vars.DOCKER_DEPLOY_S3_BUCKET }}' \
            S3_PATH_STYLE_ACCESS='${{ vars.DOCKER_DEPLOY_S3_PATH_STYLE_ACCESS }}' \
            JAVA_OPTS='${{ vars.DOCKER_DEPLOY_JAVA_OPTS }}' \
            JWS256='${{ secrets.DOCKER_DEPLOY_JWS256 }}' \
            PYTHON_EXEC_LIMIT_ENABLED='${{ vars.DOCKER_DEPLOY_PYTHON_EXEC_LIMIT_ENABLED }}' \
            CHROMA_HOST='${{ vars.DOCKER_DEPLOY_CHROMA_HOST }}' \
            FULL_IMAGE='${FULL_IMAGE}' \
            bash /tmp/start_container.sh"

          echo 'container started'

      - name: Verify Container Status
        run: |
          echo "verify container status..."

          ssh -o StrictHostKeyChecking=no ${{ secrets.DOCKER_DEPLOY_HOST }} "
            docker ps -a | grep ${{ inputs.containerName }}
          "
