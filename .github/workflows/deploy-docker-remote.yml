name: Deploy Docker Image To Remote Host

on:
  workflow_dispatch:
    inputs:
      imageTag:
        description: 'docker image tag'
        type: string
        required: true
      registry:
        description: 'select registry'
        type: choice
        default: "registry.cn-hangzhou.aliyuncs.com/opensrcdevelop/auth-server"
        required: true
        options:
          - ccr.ccs.tencentyun.com/opensrcdevelop/auth-server
          - registry.cn-hangzhou.aliyuncs.com/opensrcdevelop/auth-server
          - registry.cn-hangzhou.aliyuncs.com/opensrcdevelop/auth-server-quickstart
      containerName:
        description: 'container name'
        type: string
        required: true
        default: auth_server

jobs:
  deploy-to-remote:
    name: Deploy To Remote Host
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DOCKER_DEPLOY_SSH_PK }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.DOCKER_DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Cleanup Old Container And Image
        run: |
          echo "========================================="
          echo "cleanup old container and image"
          echo "========================================="

          ssh -o StrictHostKeyChecking=no ${{ secrets.DOCKER_DEPLOY_HOST }} "
            echo 'stop and remove old container...'
            docker stop ${{ inputs.containerName }} 2>/dev/null || true
            docker rm ${{ inputs.containerName }} 2>/dev/null || true
            echo 'remove old image...'
            docker rmi \$(docker images -q ${{ inputs.registry }}:${{ inputs.imageTag }}) 2>/dev/null || true
            echo 'cleanup done'
          "

      - name: Execute Docker Pull On Remote Host
        run: |
          FULL_IMAGE="${{ inputs.registry }}:${{ inputs.imageTag }}"
          echo "========================================="
          echo "docker pull ${FULL_IMAGE}"
          echo "========================================="

          ssh -o StrictHostKeyChecking=no ${{ secrets.DOCKER_DEPLOY_HOST }} "
            echo 'docker pull...'
            docker pull ${FULL_IMAGE}
            echo 'done'
          "

      - name: Start New Container
        run: |
          FULL_IMAGE="${{ inputs.registry }}:${{ inputs.imageTag }}"
          PORT="${{ secrets.DOCKER_DEPLOY_APP_PORT }}"

          echo "========================================="
          echo "start new container"
          echo "container: ${{ inputs.containerName }}"
          echo "image: ${FULL_IMAGE}"
          echo "========================================="

          ssh -o StrictHostKeyChecking=no ${{ secrets.DOCKER_DEPLOY_HOST }} "
            docker run -d --name ${{ inputs.containerName }} \
              -p \${PORT}:8080 \
              -e REDIS_HOST=${{ vars.DOCKER_PLOY_REDIS_HOST }} \
              -e REDIS_PORT=${{ vars.DOCKER_PLOY_REDIS_PORT }} \
              -e REDIS_PASSWORD=${{ secrets.DOCKER_PLOY_REDIS_PASSWORD }} \
              -e API_DOC_ENABLED=${{ vars.DOCKER_PLOY_API_DOC_ENABLED }} \
              -e SWAGGER_UI_ENABLED=${{ vars.DOCKER_PLOY_SWAGGER_UI_ENABLED }} \
              -e AUTH_SERVER_CONSOLE_CLIENT_ID=${{ vars.DOCKER_PLOY_AUTH_SERVER_CONSOLE_CLIENT_ID }} \
              -e DEFAULT_ISSUER=${{ vars.DOCKER_PLOY_DEFAULT_ISSUER }} \
              -e DEFAULT_CONSOLE_URL=${{ vars.DOCKER_PLOY_DEFAULT_CONSOLE_URL }} \
              -e LOGIN_PAGE_URL=${{ vars.DOCKER_PLOY_LOGIN_PAGE_URL }} \
              -e DB_BASE_URL=${{ vars.DOCKER_PLOY_DB_BASE_URL }} \
              -e DB_USERNAME=${{ vars.DOCKER_PLOY_DB_USERNAME }} \
              -e DB_PASSWORD=${{ secrets.DOCKER_PLOY_DB_PASSWORD }} \
              -e DB_PREFIX=${{ vars.DOCKER_PLOY_DB_PREFIX }} \
              -e DEFAULT_TENANT=${{ vars.DOCKER_PLOY_DEFAULT_TENANT }} \
              -e ASYNC_TASK_STORAGE_TYPE=${{ vars.DOCKER_PLOY_ASYNC_TASK_STORAGE_TYPE }} \
              -e S3_ENDPOINT=${{ vars.DOCKER_PLOY_S3_ENDPOINT }} \
              -e S3_ACCESS_KEY=${{ secrets.DOCKER_PLOY_S3_ACCESS_KEY }} \
              -e S3_SECRET_KEY=${{ secrets.DOCKER_PLOY_S3_SECRET_KEY }} \
              -e S3_BUCKET=${{ vars.DOCKER_PLOY_S3_BUCKET }} \
              -e S3_PATH_STYLE_ACCESS=${{ vars.DOCKER_PLOY_S3_PATH_STYLE_ACCESS }} \
              -e JAVA_OPTS=${{ vars.DOCKER_PLOY_JAVA_OPTS }} \
              -e JWS256=${{ secrets.DOCKER_PLOY_JWS256 }} \
              -e PYTHON_EXEC_LIMIT_ENABLED=${{ vars.DOCKER_PLOY_PYTHON_EXEC_LIMIT_ENABLED }} \
              -e CHROMA_HOST=${{ vars.DOCKER_PLOY_CHROMA_HOST }} \
              -v auth_server_log_volume:/app/logs \
              --network auth_server_network \
              --restart always \
              \${FULL_IMAGE}
          "

          echo 'container started'

      - name: Verify Container Status
        run: |
          echo "verify container status..."

          ssh -o StrictHostKeyChecking=no ${{ secrets.DOCKER_DEPLOY_HOST }} "
            docker ps -a | grep ${{ inputs.containerName }}
          "
