ai.chat.default-language=\u7B80\u4F53\u4E2D\u6587
ai.chat.default-max-think-steps=30
ai.chat.default-llm-api-retry-count=3
ai.chat.memory.message-window-size=10

# ChatBI \u67E5\u8BE2\u7ED3\u679C\u4E34\u65F6\u6587\u4EF6\u914D\u7F6E
chatbi.query-result.threshold=${CHATBI_QUERY_RESULT_THRESHOLD:20}
chatbi.query-result.directory=${CHATBI_QUERY_RESULT_DIR:${java.io.tmpdir}/chatbi-query-results}

# Python \u811A\u672C\u6267\u884C\u8D44\u6E90\u9650\u5236
python.exec.limit.enabled=${PYTHON_EXEC_LIMIT_ENABLED:true}
python.exec.limit.file-write-enabled=${PYTHON_EXEC_LIMIT_FILE_WRITE_ENABLED:false}
python.exec.limit.memory-mb=${PYTHON_EXEC_LIMIT_MEMORY_MB:256}

spring.ai.model.chat=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.moderation=none
spring.ai.chat.client.enabled=false
