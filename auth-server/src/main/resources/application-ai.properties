ai.chat.language=\u7B80\u4F53\u4E2D\u6587
ai.chat.memory.message-window-size=10

# Python \u811A\u672C\u6267\u884C\u8D44\u6E90\u9650\u5236
python.exec.limit.enabled=${PYTHON_EXEC_LIMIT_ENABLED:true}
python.exec.limit.cpu-time=${PYTHON_EXEC_LIMIT_CPU_TIME:60}
python.exec.limit.file-size-kb=${PYTHON_EXEC_LIMIT_FILE_SIZE_KB:51200}
python.exec.limit.max-processes=${PYTHON_EXEC_LIMIT_MAX_PROCESSES:1000}
python.exec.limit.memory-mb=${PYTHON_EXEC_LIMIT_MEMORY_MB:256}

spring.ai.model.chat=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.moderation=none
spring.ai.chat.client.enabled=false

# Milvus 向量数据库
milvus.host=${MILVUS_HOST:localhost}
milvus.port=${MILVUS_PORT:19530}
